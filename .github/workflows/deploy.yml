name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (laat leeg voor auto)'
        required: false
        default: ''

env:
  IMAGE_NAME: ghcr.io/gavinguler/chef-agent
  DEPLOY_HOST: 192.168.0.61
  DEPLOY_PORT: 8001

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(date -u +%Y.%-m.%-d).${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy via SSH
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GITHUB_TOKEN_WIKI: ${{ secrets.GITHUB_TOKEN_WIKI }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
        run: |
          set -e

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@${{ env.DEPLOY_HOST }} bash -s << 'SSHEOF'
          set -e

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u gavinguler --password-stdin

          docker pull ${{ env.IMAGE_NAME }}:$VERSION

          docker stop chef-agent 2>/dev/null || true
          docker rm chef-agent 2>/dev/null || true

          docker run -d \
            --name chef-agent \
            --restart unless-stopped \
            -p ${{ env.DEPLOY_PORT }}:${{ env.DEPLOY_PORT }} \
            -e PORT=${{ env.DEPLOY_PORT }} \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            -e TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" \
            -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            -e UNSPLASH_ACCESS_KEY="$UNSPLASH_ACCESS_KEY" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN_WIKI" \
            -e OLLAMA_BASE_URL="$OLLAMA_BASE_URL" \
            ${{ env.IMAGE_NAME }}:$VERSION

          echo "chef-agent draait op ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PORT }}"
          docker ps | grep chef-agent
          SSHEOF

          rm -f ~/.ssh/deploy_key
